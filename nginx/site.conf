# Plain HTTP. Mounted over the ui image's /etc/nginx/conf.d/default.conf; the
# image's stock nginx.conf includes it, and mime.types, and is not replaced.
# For HTTPS, mount site-tls.conf there instead (README, TLS).
server {
  listen 80 default_server;
  listen [::]:80 default_server;

  # The bundle: root, gzip, etag and `location /`. Shipped by the ui image.
  include /etc/nginx/snippets/stellar-ui.conf;
  include /etc/nginx/snippets/api-proxy.conf;
}
