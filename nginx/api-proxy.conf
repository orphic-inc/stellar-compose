# The one /api/ block (#58). site.conf and site-tls.conf both include it, so a
# change to how the api is reached is made once. The copies this replaces
# drifted twice: a wrong port (#59) and a lost mime.types include (#61).
#
# Mounted at /etc/nginx/snippets/api-proxy.conf, beside stellar-ui.conf, which
# the ui image ships and which owns `location /` (stellar-ui ADR-0011).
location /api/ {
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_pass http://api:8080;
  proxy_ssl_session_reuse off;
  proxy_set_header Host $http_host;
  proxy_cache_bypass $http_upgrade;
  proxy_redirect off;
}
