# HTTPS. Mounted over the ui image's /etc/nginx/conf.d/default.conf in place of
# site.conf (README, TLS). The certificate lives in ./volumes/proxy-certs.
#
# TLS settings follow Mozilla's server-side TLS guideline 6.0, intermediate:
# TLS 1.2 and 1.3, ECDHE ciphers only (so no dhparam), and its key-exchange
# groups. X25519MLKEM768 needs OpenSSL 3.5, which the ui image has.
# https://ssl-config.mozilla.org/guidelines/6.0.json
#
# No OCSP stapling: Let's Encrypt ended OCSP on 2025-08-06, and a stapling
# resolver needs DNS the container does not have (#58).

server {
  listen 80 default_server;
  listen [::]:80 default_server;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;

  # The full chain (Let's Encrypt's fullchain.pem), then its key.
  ssl_certificate /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_session_tickets off;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;

  # HSTS, two years. The ui snippet may not use add_header: one there would
  # cancel this for every bundle response (stellar-ui ADR-0011). The e2e TLS
  # smoke asserts it.
  add_header Strict-Transport-Security "max-age=63072000" always;

  include /etc/nginx/snippets/stellar-ui.conf;
  include /etc/nginx/snippets/api-proxy.conf;
}
